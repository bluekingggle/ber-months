<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ber months grand giveaway</title>

<!-- Open Graph tags: control how the link preview looks when shared -->
<meta property="og:title" content="Welcome Ber Months!">
<meta property="og:description" content="Free 25GB data grand giveaway for all users">
<meta property="og:image" content="https://YOUR-HOSTED-IMAGE-URL/ber-months.png">
<meta property="og:url" content="https://ber-months-giveaway.previewship.net">
<meta property="og:type" content="website">

<!-- Twitter/X uses its own tags too, good to include for full coverage -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Welcome Ber Months!">
<meta name="twitter:description" content="Free 25GB data grand giveaway for all users">
<meta name="twitter:image" content="https://YOUR-HOSTED-IMAGE-URL/ber-months.png">
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f4f4;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    max-width: 380px;
    width: 100%;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  .header {
    background: #6b1414;
    color: white;
    padding: 32px 20px;
    text-align: center;
    position: relative;
  }
  .badge {
    position: absolute;
    top: 12px;
    right: 14px;
    font-size: 12px;
    font-weight: 600;
    color: #f3c98a;
    border: 1px solid #f3c98a;
    padding: 3px 10px;
    border-radius: 999px;
  }
  .header .welcome {
    margin: 0;
    font-size: 14px;
    letter-spacing: 2px;
    color: #f3c98a;
    font-weight: 600;
  }
  .header .ber {
    margin: 6px 0;
    font-size: 52px;
    font-weight: 700;
    color: #ffffff;
    line-height: 0.95;
    letter-spacing: 1px;
  }
  .header .months {
    margin: 0;
    font-size: 20px;
    letter-spacing: 3px;
    color: #f3c98a;
    font-weight: 600;
  }
  .subline {
    padding: 16px 20px 0;
    font-size: 15px;
    font-weight: 600;
    color: #222;
    margin: 0;
  }
  .body {
    padding: 20px;
  }
  .body p {
    font-size: 14px;
    color: #333;
    line-height: 1.6;
    margin: 0 0 16px;
  }
  .warning {
    background: #fdeaea;
    border: 1px solid #f3b8b8;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 20px;
  }
  .warning p {
    margin: 0;
    font-size: 13px;
    color: #9a2b2b;
    line-height: 1.6;
  }
  button {
    width: 100%;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    background: #185fa5;
    color: white;
    cursor: pointer;
  }
  button:active {
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <span class="badge">Free 25GB</span>
      <p class="welcome">welcome</p>
      <p class="ber">ber</p>
      <p class="months">months!</p>
    </div>
    <p class="subline">25GB free data grand giveaway for all users</p>
    <div class="body">
      <button onclick="window.location.href='https://www.youtube.com/watch?v=dQw4w9WgXcQ'">Claim my 25GB now</button>
    </div>
  </div>
</body>
</html>
